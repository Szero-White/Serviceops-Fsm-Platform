services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [serviceops]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,demo}
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-serviceops-demo}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FILE_STORAGE_ROOT: /app/data/uploads
      MAX_TENANT_STORAGE_BYTES: ${MAX_TENANT_STORAGE_BYTES:-104857600}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-60}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [serviceops]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
        VITE_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [serviceops]

volumes:
  postgres_data:
  uploads_data:

networks:
  serviceops:
    driver: bridge
