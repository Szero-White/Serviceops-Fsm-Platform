spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    show-sql: false

server:
  forward-headers-strategy: framework
  shutdown: graceful

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

serviceops:
  jwt:
    issuer: ${JWT_ISSUER:serviceops}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    secret: ${JWT_SECRET}
  storage:
    root: ${FILE_STORAGE_ROOT:/app/data/uploads}
    max-tenant-bytes: ${MAX_TENANT_STORAGE_BYTES:0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  demo:
    enabled: false
  ai:
    enabled: ${AI_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId} %logger{36} - %msg%n"
  level:
    root: INFO
    com.serviceops: INFO
    org.springframework.security: WARN

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
