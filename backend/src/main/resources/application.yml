spring:
  application:
    name: serviceops
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

serviceops:
  jwt:
    issuer: serviceops-local
    access-token-minutes: 480
    secret: ${JWT_SECRET:U2VydmljZU9wcy1Mb2NhbC1EZXZlbG9wbWVudC1TZWNyZXQtS2V5LTIwMjYtMTIzNDU2Nzg5MA==}
  storage:
    root: ${FILE_STORAGE_ROOT:./data/uploads}
    max-tenant-bytes: ${MAX_TENANT_STORAGE_BYTES:0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  demo:
    enabled: ${DEMO_MODE:false}
    seed-password: ${DEMO_PASSWORD:123456}
  auth:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:60}
  notifications:
    overdue-scan:
      customer-service-grace: ${OVERDUE_CUSTOMER_SERVICE_GRACE:15m}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:gemini}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
    timeout: ${AI_TIMEOUT:20s}
